services:
  - type: web
    name: parqueadero-backend
    runtime: docker
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: c2afe8d4a1b9f6e3c7d2e5f8a0b3c6d9e1f4a7b0c2d5e8f1a3b6c9d0e2f5a8
      - key: ADMIN_PASSWORD
        value: admin123
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"

# Base de datos: Neon (gratis, sin suspender como Render).
# 1. Crea el proyecto en neon.tech y copia la POOLED connection string
#    postgresql://user:pass@ep-xxx-pooler.us-east-1.aws.neon.tech/parqueadero_db?sslmode=require
# 2. En el dashboard Render -> parqueadero-backend -> Environment -> DATABASE_URL = esa URL
# 3. Redeploy. La DB free de Render se elimina el 2-oct, ya no se usa.
