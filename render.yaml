services:
  - type: web
    name: parqueadero-backend
    runtime: docker
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: c2afe8d4a1b9f6e3c7d2e5f8a0b3c6d9e1f4a7b0c2d5e8f1a3b6c9d0e2f5a8
      - key: ADMIN_PASSWORD
        value: admin123
      - key: DATABASE_URL
        fromDatabase:
          name: parqueadero-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: parqueadero-db
    plan: free
    databaseName: parqueadero_db
    user: admin
