name: Quality checks
# Phase 6: role and branch authorization regression coverage

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  backend:
    name: Backend typecheck and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests without database
        if: always()
        run: npx vitest run src/tests/helpers/caja.test.ts src/tests/schemas/usuario.test.ts src/tests/services/ticket.test.ts src/tests/services/calculadorCobros.test.ts src/tests/modules/ingresos.test.ts src/tests/schemas/caja-gasto.test.ts src/tests/services/gastos.test.ts src/tests/utils/fechas.test.ts src/tests/utils/saldos.test.ts src/tests/utils/periodoReporte.test.ts src/tests/utils/puestos.test.ts src/tests/modules/reportes.test.ts src/tests/modules/dashboard.test.ts src/tests/middlewares/roles.middleware.test.ts src/tests/utils/sucursalAccess.test.ts src/tests/helpers/movimientos.test.ts

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build

  postgres-integration:
    name: Ingress concurrency integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: parqueadero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d parqueadero_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/parqueadero_test?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate --schema=prisma/schema.prisma
      - name: Apply database migrations
        run: npx prisma migrate deploy --schema=prisma/schema.prisma
      - name: Fail when migrations do not match the Prisma schema
        shell: bash
        run: |
          diff_sql="$(npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --script)"
          # Prisma emits a comment even when there is no schema drift:
          # "-- This is an empty migration." Do not mistake that comment for SQL.
          if printf '%s\n' "$diff_sql" | grep -Eiq '^[[:space:]]*(CREATE|ALTER|DROP|COMMENT|GRANT|REVOKE|TRUNCATE|INSERT|UPDATE|DELETE)[[:space:]]'; then
            echo "::error::The deployed migrations do not produce the current Prisma schema."
            printf '%s\n' "$diff_sql"
            exit 1
          fi
          echo "Schema and applied migrations are in sync."
      - name: Seed minimal test data
        run: node prisma/seed/seed-test.mjs
      - name: Run PostgreSQL integration tests
        run: npm run test:integration
