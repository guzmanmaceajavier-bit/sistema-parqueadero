name: Quality checks

on:
  pull_request:
    branches: [main]
jobs:
  backend:
    name: Backend typecheck and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests without database
        if: always()
        run: npx vitest run src/tests/helpers/caja.test.ts src/tests/schemas/usuario.test.ts src/tests/services/ticket.test.ts src/tests/services/calculadorCobros.test.ts src/tests/modules/ingresos.test.ts src/tests/schemas/caja-gasto.test.ts src/tests/services/gastos.test.ts src/tests/utils/fechas.test.ts src/tests/utils/saldos.test.ts src/tests/utils/periodoReporte.test.ts src/tests/utils/puestos.test.ts src/tests/modules/reportes.test.ts src/tests/modules/dashboard.test.ts src/tests/middlewares/roles.middleware.test.ts src/tests/utils/sucursalAccess.test.ts

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build

  postgres-integration:
    name: Ingress concurrency integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: parkadmin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d parkadmin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/parkadmin_test?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate --schema=prisma/schema.prisma
      - name: Apply database migrations
        run: npx prisma migrate deploy --schema=prisma/schema.prisma
      - name: Inspect schema drift against Prisma models
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --script
      - name: Sync ephemeral test database to Prisma schema
        run: npx prisma db push --schema=prisma/schema.prisma --skip-generate --accept-data-loss
      - name: Run PostgreSQL integration tests
        run: npm run test:integration
